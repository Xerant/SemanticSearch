[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semanticsearch"
version = "0.1.0"
description = "Domain-agnostic, on-premise RAG engine driven by domain packs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/semanticsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
